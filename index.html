<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wed của bảo</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: white;
    color: #222;
}

/* SIDEBAR */
.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 220px;
    height: 100vh;
    background: #f7f7f8;
    border-right: 1px solid #ddd;
    padding: 15px;
    transition: .3s;
    z-index: 10;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    padding: 10px;
    margin-bottom: 25px;
}

.menu {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.menu a {
    color: #333;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
}

.menu a:hover {
    background: #e5e5e5;
}

.content {
    margin-left: 220px;
    padding: 45px;
    min-height: 100vh;
    transition: .3s;
}

.content.full {
    margin-left: 0;
}

.hidden {
    display: none !important;
}

/* NÚT THU GỌN */
.toggle {
    position: fixed;
    left: 230px;
    top: 10px;
    border: none;
    background: #eee;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    z-index: 20;
}

.toggle.closed {
    left: 10px;
}

.sidebar.closed {
    width: 0;
    padding: 0;
    overflow: hidden;
}

/* NHẬP TÊN */
.name-box {
    display: flex;
    gap: 10px;
    max-width: 600px;
}

.name-box input {
    flex: 1;
    padding: 15px 20px;
    font-size: 18px;
    border: 2px solid #222;
    border-radius: 30px;
    outline: none;
}

.name-box button {
    padding: 12px 25px;
    border: none;
    border-radius: 25px;
    background: #222;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

/* CHỌN LỚP */
.class-box {
    display: flex;
    gap: 15px;
    margin-top: 25px;
}

.class-box button {
    padding: 15px 25px;
    border: 1px solid #ccc;
    background: white;
    border-radius: 15px;
    cursor: pointer;
    font-size: 18px;
}

.class-box button:hover {
    background: #eee;
}

/* MŨI TÊN */
.arrow-circle {
    width: 55px;
    height: 55px;
    border: 2px solid #222;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    cursor: pointer;
    margin-top: 20px;
    transition: 0.2s;
}

.arrow-circle:hover {
    background: #f0f0f0;
    transform: scale(1.05);
}

/* TÌM KIẾM */
.search-box {
    width: 100%;
    max-width: 650px;
    margin: 0 auto 40px auto;
}

.search-box input {
    width: 100%;
    padding: 17px 25px;
    border: 3px solid #222;
    border-radius: 40px;
    font-size: 18px;
    outline: none;
}

/* KẾT QUẢ */
.result {
    max-width: 650px;
    margin: auto;
    border: 1px solid #ddd;
    border-radius: 15px;
    padding: 20px;
    position: relative;
}

.result-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 20px;
}

.copy-btn {
    position: absolute;
    right: 15px;
    top: 15px;
    background: #222;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
}

.answer {
    font-size: 17px;
    line-height: 1.5;
    word-break: break-word;
}

/* DANH SÁCH */
.search-item {
    max-width: 600px;
    padding: 15px 20px;
    border: 1px solid #ddd;
    border-radius: 12px;
    margin-top: 15px;
    cursor: pointer;
    background: white;
    font-size: 18px;
}

.search-item:hover {
    background: #f1f1f1;
}


/* CHAT ONLINE */

function showChat() {
    hideAll();

    document
        .getElementById("chatScreen")
        .classList
        .remove("hidden");
}

/* CÀI ĐẶT */
.setting-box {
    max-width: 600px;
}

.setting-box button {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    margin-top: 10px;
    cursor: pointer;
}

.logout {
    background: #e53935;
    color: white;
}

        /* CHAT ONLINE */
        .chat-page {
            max-width: 1100px;
        }

        .chat-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .chat-head h1 {
            margin: 0 0 5px;
        }

        .chat-head p {
            margin: 0;
            color: #666;
        }

        .online-box {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: #fff;
        }

        .chat-layout {
            display: grid;
            grid-template-columns: 230px 1fr;
            gap: 15px;
            min-height: 65vh;
        }

        .online-users,
        .chat-panel {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 14px;
        }

        .online-users {
            padding: 15px;
        }

        .online-users h3 {
            margin-top: 0;
        }

        .online-user {
            padding: 8px 10px;
            margin-bottom: 5px;
            border-radius: 8px;
            background: #f5f5f5;
        }

        .chat-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            min-height: 55vh;
            max-height: 60vh;
            overflow-y: auto;
            padding: 18px;
            background: #fafafa;
        }

        .message {
            max-width: 80%;
            margin-bottom: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            background: #fff;
            border: 1px solid #e1e1e1;
        }

        .message-name {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .message-text {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message-time {
            margin-top: 5px;
            font-size: 11px;
            color: #888;
        }

        .message-me {
            margin-left: auto;
        }

        .delete-message {
            margin-top: 6px;
            border: 0;
            background: transparent;
            color: #b00020;
            cursor: pointer;
            font-size: 12px;
        }

        .chat-form {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid #ddd;
            background: #fff;
        }

        .chat-form input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
        }

        .chat-form button {
            padding: 12px 18px;
            border: 0;
            border-radius: 10px;
            background: #222;
            color: #fff;
            cursor: pointer;
        }

        @media (max-width: 750px) {
            .chat-layout {
                grid-template-columns: 1fr;
            }

            .online-users {
                display: none;
            }

            .chat-head {
                align-items: flex-start;
                flex-direction: column;
            }
        }

    </style>

</head>

<body>

<!-- THANH BÊN TRÁI -->

<div class="sidebar" id="sidebar">

<div class="logo">
    Hệ thống
</div>

<div class="menu">

    <a onclick="showHome()">
        🏠 Trang chủ
    </a>

    <a onclick="showList()">
        📋 Danh sách tìm kiếm
    </a>

    <a>
        💻 Code
    </a>

    <a onclick="showSettings()">
        ⚙️ Cài đặt
    </a>

    <a onclick="showVietack()">
        🧩 Vietack
    </a>

    <a onclick="showChat()">
        💬 Trò chuyện online
    </a>

</div>

</div>

<!-- NÚT THU GỌN -->

<button
 class="toggle"
 id="toggle"
 onclick="toggleSidebar()">
☰
</button>

<!-- NHẬP TÊN -->

<main class="content" id="nameScreen">

<h1>Nhập tên của bạn</h1>

<div class="name-box">

    <input
        type="text"
        id="nameInput"
        placeholder="Nhập tên của bạn">

    <button onclick="saveName()">
        OK
    </button>

</div>

</main>

<!-- CHỌN LỚP -->

<main class="content hidden" id="classScreen">

<h1 id="helloName"></h1>

<h2>Bro ở lớp mấy?</h2>

<div
    class="arrow-circle"
    onclick="showClasses()">
    ↓
</div>

<div
    class="class-box hidden"
    id="classList">

    <button onclick="saveClass('5.1')">
        5.1
    </button>

    <button onclick="saveClass('5.2')">
        5.2
    </button>

    <button onclick="saveClass('5.3')">
        5.3
    </button>

</div>

</main>

<!-- TRANG CHỦ -->

<main class="content hidden" id="homeScreen">

<div class="search-box">

    <input
        type="text"
        id="searchInput"
        placeholder="Tìm kiếm"
        onkeydown="searchKey(event)">

</div>

<div id="welcomeArea">

    <h1 id="welcome"></h1>

    <p id="classText"></p>

    <p>
        Chào mừng bạn đến với hệ thống 😎
    </p>

</div>

<div
    id="searchResult"
    class="result hidden">

    <div
        id="resultTitle"
        class="result-title">
    </div>

    <button
        class="copy-btn"
        id="copyButton"

        📋 Copy

    <div
        class="answer"
        id="answer">
    </div>

</div>

</main>

<!-- DANH SÁCH TÌM KIẾM -->

<main class="content hidden" id="listScreen">

<h1>Danh sách</h1>

<div
    class="search-item"
    onclick="searchFromList('hack')">
    hack
</div>

</main>

<!-- CÀI ĐẶT -->

<!-- VIETACK -->
<main class="content hidden" id="vietackScreen">

    <iframe
        src="https://vietjack.com/"
        title="Vietack"
        style="
            width: 100%;
            height: calc(100vh - 20px);
            border: none;
            border-radius: 10px;
            background: white;
        ">
    </iframe>

</main>

<!-- CHAT ONLINE -->
<main class="content hidden" id="chatScreen" style="display:none;">

    <div class="chat-page">
        <div class="chat-head">
            <div>
                <h1>💬 Trò chuyện online</h1>
                <p id="chatStatus">Đang kết nối Firebase...</p>
            </div>
            <div class="online-box">
                🟢 <span id="onlineCount">0</span> đang online
            </div>
        </div>

        <div class="chat-layout">
            <aside class="online-users">
                <h3>Đang online</h3>
                <div id="onlineUsers">
                    <p>Đang tải...</p>
                </div>
            </aside>

            <section class="chat-panel">
                <div id="messages" class="messages"></div>

                <form id="chatForm" class="chat-form">
                    <input
                        id="messageInput"
                        type="text"
                        maxlength="500"
                        placeholder="Nhập tin nhắn..."

                    >

<main class="content hidden" id="settingsScreen">

<h1>Cài đặt</h1>

<div class="setting-box">

    <h3>Đổi tên</h3>

    <div class="name-box">

        <input
            type="text"
            id="newNameInput"
            placeholder="Tên mới">

        <button onclick="changeName()">
            OK
        </button>

    </div>

    <h3>Đổi lớp</h3>

    <div class="class-box">

        <button onclick="changeClass('5.1')">
            5.1
        </button>

        <button onclick="changeClass('5.2')">
            5.2
        </button>

        <button onclick="changeClass('5.3')">
            5.3
        </button>

    <br>

        class="logout"
        onclick="logout()">
        🚪 Đăng xuất
    </button>

<script>

/* SIDEBAR */

function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList
        .toggle("closed");

    document
        .getElementById("toggle")
        .classList
        .toggle("closed");

    document
        .querySelectorAll(".content")
        .forEach(function(element) {
            element.classList.toggle("full");
        });
}


/* ẨN TẤT CẢ */

function hideAll() {

    document
        .querySelectorAll(".content")
        .forEach(function(element) {
            element.classList.add("hidden");
        });
}


/* NHẬP TÊN */

function showName() {

    hideAll();

    document
        .getElementById("nameScreen")
        .classList
        .remove("hidden");
}


function saveName() {

    let name =
        document
        .getElementById("nameInput")
        .value
        .trim();

    if (name === "") {
        alert("Hãy nhập tên!");
        return;
    }

    localStorage.setItem("name", name);

    hideAll();

    document
        .getElementById("classScreen")
        .classList
        .remove("hidden");

    document
        .getElementById("helloName")
        .innerText =
        "Xin chào, " + name + "! 😎";
}


/* CHỌN LỚP */

function showClasses() {

    document
        .getElementById("classList")
        .classList
        .remove("hidden");
}


function saveClass(className) {

    localStorage.setItem("class", className);

    showHome();
}


/* TRANG CHỦ */

function showHome() {

    if (!localStorage.getItem("name")) {
        showName();
        return;
    }

    hideAll();

    document
        .getElementById("homeScreen")
        .classList
        .remove("hidden");

    updateHome();

    document
        .getElementById("searchInput")
        .value = "";

    document
        .getElementById("searchResult")
        .classList
        .add("hidden");

    document
        .getElementById("welcomeArea")
        .classList
        .remove("hidden");
}


function updateHome() {

    let name =
        localStorage.getItem("name");

    let className =
        localStorage.getItem("class");

    document
        .getElementById("welcome")
        .innerText =
        "Xin chào, " + name + "! 😎";

    document
        .getElementById("classText")
        .innerText =
        "Lớp: " +
        (className || "Chưa chọn");
}


/* DANH SÁCH */

function showList() {

    if (!localStorage.getItem("name")) {
        showName();
        return;
    }

    hideAll();

    document
        .getElementById("listScreen")
        .classList
        .remove("hidden");
}


function searchFromList(text) {

    hideAll();

    document
        .getElementById("homeScreen")
        .classList
        .remove("hidden");

    document
        .getElementById("searchInput")
        .value = text;

    search();
}


/* VIETACK */

function showVietack() {
    hideAll();

    document
        .getElementById("vietackScreen")
        .classList
        .remove("hidden");
}


/* CÀI ĐẶT */

function showSettings() {

    hideAll();

    document
        .getElementById("settingsScreen")
        .classList
        .remove("hidden");

    document
        .getElementById("newNameInput")
        .value =
        localStorage.getItem("name") || "";
}


/* ĐỔI TÊN */

function changeName() {

    let newName =
        document
        .getElementById("newNameInput")
        .value
        .trim();

    if (newName === "") {
        alert("Hãy nhập tên mới!");
        return;
    }

    localStorage.setItem("name", newName);

    showHome();
}


/* ĐỔI LỚP */

function changeClass(className) {

    localStorage.setItem("class", className);

    showHome();
}


/* ĐĂNG XUẤT */

function logout() {

    localStorage.removeItem("name");
    localStorage.removeItem("class");

    document
        .getElementById("nameInput")
        .value = "";

    document
        .getElementById("searchInput")
        .value = "";

    showName();
}


/* TÌM KIẾM */

function searchKey(event) {

    if (event.key === "Enter") {
        search();
    }
}


function search() {

    let text =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    if (text === "") {
        return;
    }

    document
        .getElementById("welcomeArea")
        .classList
        .add("hidden");

    document
        .getElementById("searchResult")
        .classList
        .remove("hidden");


    if (text === "hack") {

        document
            .getElementById("resultTitle")
            .style.display = "block";

        document
            .getElementById("resultTitle")
            .innerText =
            "realkid script";

        document
            .getElementById("answer")
            .innerText =
            'loadstring(game:HttpGet("https://raw.githubusercontent.com/realkidhub/realkid/refs/heads/main/main.lua"))()';

        document
            .getElementById("copyButton")
            .style.display = "block";

    } else {

        document
            .getElementById("resultTitle")
            .style.display = "none";

        document
            .getElementById("answer")
            .innerText =
            "đéo có đâu";

        document
            .getElementById("copyButton")
            .style.display = "none";
    }
}


/* COPY */

function copyAnswer() {

    let text =
        document
        .getElementById("answer")
        .innerText;

    navigator.clipboard
        .writeText(text)
        .then(function() {
            alert("Đã copy!");
        })
        .catch(function() {
            alert("Không thể copy.");
        });
}


/* KHI MỞ WEB */

window.onload = function() {

    let name =
        localStorage.getItem("name");

    let className =
        localStorage.getItem("class");

    if (!name) {

        showName();

    } else if (!className) {

        hideAll();

        document
            .getElementById("classScreen")
            .classList
            .remove("hidden");

        document
            .getElementById("helloName")
            .innerText =
            "Xin chào, " +
            name +
            "! 😎";

    } else {

        showHome();
    }
};

</script>


<!-- FIREBASE CHAT -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import {
    getDatabase,
    ref,
    push,
    set,
    onValue,
    onDisconnect,
    remove,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

/*
    DÁN firebaseConfig CỦA BẠN VÀO ĐÂY.
    Lấy trong Firebase Console > Project settings > Your apps > Web app.
*/
const firebaseConfig = {
    apiKey: "DAN_API_KEY_CUA_BAN",
    authDomain: "TEN_PROJECT.firebaseapp.com",
    databaseURL: "https://TEN_PROJECT-default-rtdb.firebaseio.com",
    projectId: "TEN_PROJECT",
    storageBucket: "TEN_PROJECT.firebasestorage.app",
    messagingSenderId: "DAN_MESSAGING_SENDER_ID",
    appId: "DAN_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;
let onlineRef = null;
let messagesRef = null;

function getSavedName() {
    return localStorage.getItem("userName") || "Khách";
}

function escapeText(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function showChatStatus(text) {
    const el = document.getElementById("chatStatus");
    if (el) el.textContent = text;
}

function renderMessages(data) {
    const box = document.getElementById("messages");
    if (!box) return;

    box.innerHTML = "";

    const items = [];
    data.forEach(child => {
        items.push({ key: child.key, ...child.val() });
    });

    items.sort((a, b) => (a.time || 0) - (b.time || 0));

    for (const msg of items) {
        const div = document.createElement("div");
        div.className = "message" + (currentUser && msg.uid === currentUser.uid ? " message-me" : "");

        const safeName = escapeText(msg.name || "Khách");
        const safeText = escapeText(msg.text || "");
        const time = msg.time ? new Date(msg.time).toLocaleTimeString("vi-VN", {
            hour: "2-digit",
            minute: "2-digit"
        }) : "";

        div.innerHTML = `
            <div class="message-name">${safeName}</div>
            <div class="message-text">${safeText}</div>
            <div class="message-time">${time}</div>
        `;

        if (currentUser && msg.uid === currentUser.uid) {
            const del = document.createElement("button");
            del.className = "delete-message";
            del.textContent = "Xóa";
            del.onclick = () => {
                remove(ref(db, "messages/" + msg.key));
            };
            div.appendChild(del);
        }

        box.appendChild(div);
    }

    box.scrollTop = box.scrollHeight;
}

function watchMessages() {
    messagesRef = ref(db, "messages");
    onValue(messagesRef, snapshot => {
        renderMessages(snapshot);
    });
}

function watchOnlineUsers() {
    const usersRef = ref(db, "onlineUsers");

    onValue(usersRef, snapshot => {
        const box = document.getElementById("onlineUsers");
        const count = document.getElementById("onlineCount");

        if (!box || !count) return;

        box.innerHTML = "";

        let total = 0;
        snapshot.forEach(child => {
            total++;
            const user = child.val();

            const item = document.createElement("div");
            item.className = "online-user";
            item.textContent = "🟢 " + (user.name || "Khách");
            box.appendChild(item);
        });

        count.textContent = total;

        if (total === 0) {
            box.innerHTML = "<p>Chưa có ai online.</p>";
        }
    });
}

async function setupPresence(user) {
    currentUser = user;
    onlineRef = ref(db, "onlineUsers/" + user.uid);

    await set(onlineRef, {
        name: getSavedName(),
        uid: user.uid,
        online: true,
        lastSeen: serverTimestamp()
    });

    onDisconnect(onlineRef).remove();

    watchMessages();
    watchOnlineUsers();

    showChatStatus("Đã kết nối");
}

async function sendMessage(text) {
    if (!currentUser || !text.trim()) return;

    const messageRef = push(ref(db, "messages"));

    await set(messageRef, {
        uid: currentUser.uid,
        name: getSavedName(),
        text: text.trim(),
        time: serverTimestamp()
    });
}

document.getElementById("chatForm")?.addEventListener("submit", async event => {
    event.preventDefault();

    const input = document.getElementById("messageInput");
    const text = input.value;

    if (!text.trim()) return;

    input.value = "";

    try {
        await sendMessage(text);
    } catch (error) {
        console.error(error);
        showChatStatus("Không gửi được tin nhắn");
    }
});

onAuthStateChanged(auth, user => {
    if (user) {
        setupPresence(user).catch(error => {
            console.error(error);
            showChatStatus("Lỗi kết nối Firebase");
        });
    }
});

signInAnonymously(auth).catch(error => {
    console.error(error);
    showChatStatus("Chưa cấu hình Firebase");
});

/* Cho phần Cài đặt/Đăng xuất dùng được với Firebase */
window.logoutFirebase = async function () {
    try {
        if (onlineRef) {
            await remove(onlineRef);
        }
        await signOut(auth);
    } catch (error) {
        console.error(error);
    }
};
</script>
