<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #222;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;

            background: #f7f7f8;
            border-right: 1px solid #ddd;

            padding: 15px;

            transition: 0.3s;
            z-index: 5;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;

            margin-bottom: 25px;
            padding: 10px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu a {
            text-decoration: none;
            color: #333;

            padding: 11px 12px;
            border-radius: 8px;

            display: block;
            cursor: pointer;
        }

        .menu a:hover {
            background: #e5e5e5;
        }

        /* ================= CONTENT ================= */

        .content {
            margin-left: 260px;
            padding: 50px;

            transition: 0.3s;
        }

        .content.full {
            margin-left: 0;
        }

        h1 {
            font-size: 40px;
        }

        /* ================= NHẬP TÊN ================= */

        .name-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .name-box input {
            width: 350px;
            height: 55px;

            padding: 0 18px;

            font-size: 18px;

            border: 3px solid #222;
            border-radius: 18px;

            outline: none;
        }

        .name-box input:focus {
            border-color: #555;
        }

        .name-box button {
            height: 55px;

            padding: 0 25px;

            border: none;
            border-radius: 15px;

            background: #222;
            color: white;

            font-size: 18px;

            cursor: pointer;
        }

        .name-box button:hover {
            background: #444;
        }

        /* ================= CHỌN LỚP ================= */

        #classSelect,
        #settingsClassSelect {
            width: 300px;
            height: 55px;

            padding: 0 18px;

            font-size: 18px;

            border: 3px solid #222;
            border-radius: 18px;

            background: white;

            cursor: pointer;
            outline: none;
        }

        /* ================= TOGGLE ================= */

        .toggle {
            position: fixed;

            left: 270px;
            top: 15px;

            border: none;

            background: #eee;

            padding: 8px 12px;

            border-radius: 8px;

            cursor: pointer;

            z-index: 10;

            font-size: 18px;
        }

        .toggle:hover {
            background: #ddd;
        }

        .sidebar.closed {
            width: 0;
            padding: 0;
            overflow: hidden;
        }

        .toggle.closed {
            left: 15px;
        }

        /* ================= ẨN ================= */

        .hidden {
            display: none !important;
        }

        /* ================= ĐĂNG XUẤT ================= */

        .logout-btn {
            margin-top: 25px;

            padding: 12px 22px;

            border: none;
            border-radius: 12px;

            background: #222;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .logout-btn:hover {
            background: #444;
        }
    </style>
</head>


<body>


    <!-- ================= SIDEBAR ================= -->

    <div
        class="sidebar"
        id="sidebar"
    >

        <div class="logo">
            Hệ thống
        </div>

        <div class="menu">

            <a onclick="showHome()">
                🏠 Trang chủ
            </a>

            <a onclick="showHome()">
                💬 Đoạn chat
            </a>

            <a onclick="showHome()">
                💻 Code
            </a>

            <a onclick="showSettings()">
                ⚙️ Cài đặt
            </a>

        </div>

    </div>


    <!-- ================= NÚT SIDEBAR ================= -->

    <button
        class="toggle"
        id="toggle"
        onclick="toggleSidebar()"
    >
        ☰
    </button>


    <!-- ================= NỘI DUNG ================= -->

    <main
        class="content"
        id="content"
    >


        <!-- ================= NHẬP TÊN ================= -->

        <div id="nameScreen">

            <h1>
                Nhập tên của bạn
            </h1>

            <div class="name-box">

                <input
                    type="text"
                    id="nameInput"
                    placeholder="Nhập tên của bạn"
                    autocomplete="off"
                >

                <button onclick="saveName()">
                    OK
                </button>

            </div>

        </div>


        <!-- ================= TRANG CHỦ ================= -->

        <div
            id="homeScreen"
            class="hidden"
        >

            <h1 id="welcome">
            </h1>

            <p>
                Chào mừng bạn đến với hệ thống 😎
            </p>


            <div id="classQuestion">

                <h2>
                    Bro ở lớp mấy?
                </h2>

                <select
                    id="classSelect"
                    onchange="saveClass()"
                >

                    <option value="">
                        ▼ Chọn lớp
                    </option>

                    <option value="5.1">
                        5.1
                    </option>

                    <option value="5.2">
                        5.2
                    </option>

                    <option value="5.3">
                        5.3
                    </option>

                </select>

            </div>

        </div>


        <!-- ================= CÀI ĐẶT ================= -->

        <div
            id="settingsScreen"
            class="hidden"
        >

            <h1>
                Cài đặt
            </h1>


            <!-- ĐỔI TÊN -->

            <p>
                Đổi tên của bạn:
            </p>

            <div class="name-box">

                <input
                    type="text"
                    id="newNameInput"
                    placeholder="Tên mới"
                    autocomplete="off"
                >

                <button onclick="changeName()">
                    OK
                </button>

            </div>


            <br>


            <!-- ĐỔI LỚP -->

            <p>
                Đổi lớp của bạn:
            </p>

            <select
                id="settingsClassSelect"
                onchange="changeClass()"
            >

                <option value="">
                    ▼ Chọn lớp
                </option>

                <option value="5.1">
                    5.1
                </option>

                <option value="5.2">
                    5.2
                </option>

                <option value="5.3">
                    5.3
                </option>

            </select>


            <p>
                Lớp hiện tại:
                <b id="currentClass">
                    Chưa chọn
                </b>
            </p>


            <!-- ĐĂNG XUẤT -->

            <button
                class="logout-btn"
                onclick="logout()"
            >
                🚪 Đăng xuất
            </button>

        </div>

    </main>


    <script>

        /* ================= SIDEBAR ================= */

        function toggleSidebar() {

            document
                .getElementById("sidebar")
                .classList.toggle("closed");

            document
                .getElementById("content")
                .classList.toggle("full");

            document
                .getElementById("toggle")
                .classList.toggle("closed");
        }


        /* ================= TRANG CHỦ ================= */

        function showHome() {

            document
                .getElementById("nameScreen")
                .classList.add("hidden");

            document
                .getElementById("settingsScreen")
                .classList.add("hidden");


            const home =
                document.getElementById("homeScreen");


            const name =
                localStorage.getItem("userName");

            const className =
                localStorage.getItem("userClass");


            /*
             * Nếu đã chọn lớp:
             * Trang chủ sẽ trắng hoàn toàn.
             */

            if (className) {

                home.classList.add("hidden");

                return;
            }


            /*
             * Chưa chọn lớp:
             * Hiện trang chủ.
             */

            home.classList.remove("hidden");


            if (name) {

                document
                    .getElementById("welcome")
                    .innerText =
                    "Xin chào, " + name + "!";

            }

        }


        /* ================= CÀI ĐẶT ================= */

        function showSettings() {

            document
                .getElementById("nameScreen")
                .classList.add("hidden");

            document
                .getElementById("homeScreen")
                .classList.add("hidden");

            document
                .getElementById("settingsScreen")
                .classList.remove("hidden");


            const name =
                localStorage.getItem("userName");

            const className =
                localStorage.getItem("userClass");


            document
                .getElementById("newNameInput")
                .value =
                name || "";


            document
                .getElementById("currentClass")
                .innerText =
                className || "Chưa chọn";


            document
                .getElementById("settingsClassSelect")
                .value =
                className || "";
        }


        /* ================= LƯU TÊN ================= */

        function saveName() {

            const name =
                document
                    .getElementById("nameInput")
                    .value
                    .trim();


            if (name === "") {

                alert("Bạn chưa nhập tên!");

                return;
            }


            localStorage.setItem(
                "userName",
                name
            );


            /*
             * Sau khi nhập tên:
             * Hiện Trang chủ để chọn lớp.
             */

            document
                .getElementById("nameScreen")
                .classList.add("hidden");

            document
                .getElementById("homeScreen")
                .classList.remove("hidden");

            document
                .getElementById("settingsScreen")
                .classList.add("hidden");


            document
                .getElementById("welcome")
                .innerText =
                "Xin chào, " + name + "!";

        }


        /* ================= CHỌN LỚP ================= */

        function saveClass() {

            const className =
                document
                    .getElementById("classSelect")
                    .value;


            if (className === "") {
                return;
            }


            /*
             * Lưu lớp.
             */

            localStorage.setItem(
                "userClass",
                className
            );


            /*
             * Sau khi chọn lớp:
             * Ẩn TOÀN BỘ Trang chủ.
             */

            document
                .getElementById("homeScreen")
                .classList.add("hidden");

        }


        /* ================= ĐỔI TÊN ================= */

        function changeName() {

            const newName =
                document
                    .getElementById("newNameInput")
                    .value
                    .trim();


            if (newName === "") {

                alert("Bạn chưa nhập tên mới!");

                return;
            }


            localStorage.setItem(
                "userName",
                newName
            );


            alert("Đã đổi tên!");


            showSettings();
        }


        /* ================= ĐỔI LỚP ================= */

        function changeClass() {

            const className =
                document
                    .getElementById("settingsClassSelect")
                    .value;


            if (className === "") {
                return;
            }


            localStorage.setItem(
                "userClass",
                className
            );


            document
                .getElementById("currentClass")
                .innerText =
                className;


            alert(
                "Đã đổi lớp thành " + className
            );

        }


        /* ================= ĐĂNG XUẤT ================= */

        function logout() {

            const confirmLogout =
                confirm(
                    "Bạn có chắc muốn đăng xuất không?"
                );


            if (!confirmLogout) {
                return;
            }


            /*
             * XÓA SẠCH DỮ LIỆU
             */

            localStorage.clear();


            /* Xóa ô nhập tên */

            document
                .getElementById("nameInput")
                .value = "";


            document
                .getElementById("newNameInput")
                .value = "";


            /* Reset chọn lớp */

            document
                .getElementById("classSelect")
                .value = "";


            document
                .getElementById("settingsClassSelect")
                .value = "";


            document
                .getElementById("currentClass")
                .innerText =
                "Chưa chọn";


            /*
             * Ẩn Trang chủ
             */

            document
                .getElementById("homeScreen")
                .classList.add("hidden");


            /*
             * Ẩn Cài đặt
             */

            document
                .getElementById("settingsScreen")
                .classList.add("hidden");


            /*
             * Hiện lại Nhập tên
             */

            document
                .getElementById("nameScreen")
                .classList.remove("hidden");


            /*
             * Đưa chuột vào ô tên
             */

            document
                .getElementById("nameInput")
                .focus();

        }


        /* ================= KHI MỞ WEB ================= */

        window.onload = function() {

            const name =
                localStorage.getItem("userName");

            const className =
                localStorage.getItem("userClass");


            /*
             * Chưa có tên
             */

            if (!name) {

                document
                    .getElementById("nameScreen")
                    .classList.remove("hidden");

                document
                    .getElementById("homeScreen")
                    .classList.add("hidden");

                document
                    .getElementById("settingsScreen")
                    .classList.add("hidden");

                return;
            }


            /*
             * Có tên nhưng chưa chọn lớp
             */

            if (!className) {

                document
                    .getElementById("nameScreen")
                    .classList.add("hidden");

                document
                    .getElementById("homeScreen")
                    .classList.remove("hidden");

                document
                    .getElementById("settingsScreen")
                    .classList.add("hidden");


                document
                    .getElementById("welcome")
                    .innerText =
                    "Xin chào, " + name + "!";

                return;
            }


            /*
             * Đã có tên + lớp:
             * Trang chủ trắng.
             */

            document
                .getElementById("nameScreen")
                .classList.add("hidden");

            document
                .getElementById("homeScreen")
                .classList.add("hidden");

            document
                .getElementById("settingsScreen")
                .classList.add("hidden");

        };

    </script>

</body>

</html>
