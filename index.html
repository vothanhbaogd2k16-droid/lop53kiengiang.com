<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web của tôi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #222;
        }

        /* THANH BÊN TRÁI */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: #f7f7f8;
            border-right: 1px solid #ddd;
            padding: 15px;
            transition: 0.3s;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
            padding: 10px;
        }

        .new-chat {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            margin-bottom: 15px;
        }

        .new-chat:hover {
            background: #eeeeee;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu a {
            text-decoration: none;
            color: #333;
            padding: 11px 12px;
            border-radius: 8px;
            display: block;
        }

        .menu a:hover {
            background: #e5e5e5;
        }

        /* NỘI DUNG */
        .content {
            margin-left: 260px;
            padding: 50px;
            transition: 0.3s;
        }

        .content h1 {
            font-size: 40px;
        }

        /* NÚT THU GỌN */
        .toggle {
            position: fixed;
            left: 270px;
            top: 15px;
            border: none;
            background: #eee;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 10;
        }

        .toggle:hover {
            background: #ddd;
        }

        /* SIDEBAR THU GỌN */
        .sidebar.closed {
            width: 0;
            padding: 0;
            overflow: hidden;
        }

        .content.full {
            margin-left: 0;
        }

        .toggle.closed {
            left: 15px;
        }
    </style>
</head>

<body>

    <!-- THANH BÊN TRÁI -->
    <div class="sidebar" id="sidebar">

        

        <button class="new-chat" onclick="newChat()">
            ＋ Đoạn chat mới
        </button>

        <div class="menu">
            <a href="#">🏠 Trang chủ</a>
            <a href="#">💬 Đoạn chat</a>
            
            
            <a href="#">💻 Code</a>
            <a href="#">⚙️ Cài đặt</a>
        </div>

    </div>

    <!-- NÚT ĐÓNG/MỞ -->
    <button class="toggle" id="toggle" onclick="toggleSidebar()">
        ☰
    </button>

    <!-- NỘI DUNG CHÍNH -->
    <main class="content" id="content">

        <h1>Xin chào! 👋</h1>

        <p>
            Đây là website đầu tiên của tôi 😎
        </p>

        <p>
            Tôi đang học cách tạo website.
        </p>

    </main>

    <script>
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("closed");
            document.getElementById("content").classList.toggle("full");
            document.getElementById("toggle").classList.toggle("closed");
        }

        function newChat() {
            alert("Đã tạo đoạn chat mới!");
        }
    </script>

</body>
</html>
