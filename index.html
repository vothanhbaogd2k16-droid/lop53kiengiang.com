<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wed của bảo</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: white;
    color: #222;
}

/* SIDEBAR */
.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 220px;
    height: 100vh;
    background: #f7f7f8;
    border-right: 1px solid #ddd;
    padding: 15px;
    transition: .3s;
    z-index: 10;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    padding: 10px;
    margin-bottom: 25px;
}

.menu {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.menu a {
    color: #333;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
}

.menu a:hover {
    background: #e5e5e5;
}

.content {
    margin-left: 220px;
    padding: 45px;
    min-height: 100vh;
    transition: .3s;
}

.content.full {
    margin-left: 0;
}

.hidden {
    display: none !important;
}

/* NÚT THU GỌN */
.toggle {
    position: fixed;
    left: 230px;
    top: 10px;
    border: none;
    background: #eee;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    z-index: 20;
}

.toggle.closed {
    left: 10px;
}

.sidebar.closed {
    width: 0;
    padding: 0;
    overflow: hidden;
}

/* NHẬP TÊN */
.name-box {
    display: flex;
    gap: 10px;
    max-width: 600px;
}

.name-box input {
    flex: 1;
    padding: 15px 20px;
    font-size: 18px;
    border: 2px solid #222;
    border-radius: 30px;
    outline: none;
}

.name-box button {
    padding: 12px 25px;
    border: none;
    border-radius: 25px;
    background: #222;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

/* CHỌN LỚP */
.class-box {
    display: flex;
    gap: 15px;
    margin-top: 25px;
}

.class-box button {
    padding: 15px 25px;
    border: 1px solid #ccc;
    background: white;
    border-radius: 15px;
    cursor: pointer;
    font-size: 18px;
}

.class-box button:hover {
    background: #eee;
}

/* MŨI TÊN */
.arrow-circle {
    width: 55px;
    height: 55px;
    border: 2px solid #222;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    cursor: pointer;
    margin-top: 20px;
    transition: 0.2s;
}

.arrow-circle:hover {
    background: #f0f0f0;
    transform: scale(1.05);
}

/* TÌM KIẾM */
.search-box {
    width: 100%;
    max-width: 650px;
    margin: 0 auto 40px auto;
}

.search-box input {
    width: 100%;
    padding: 17px 25px;
    border: 3px solid #222;
    border-radius: 40px;
    font-size: 18px;
    outline: none;
}

/* KẾT QUẢ */
.result {
    max-width: 650px;
    margin: auto;
    border: 1px solid #ddd;
    border-radius: 15px;
    padding: 20px;
    position: relative;
}

.result-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 20px;
}

.copy-btn {
    position: absolute;
    right: 15px;
    top: 15px;
    background: #222;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
}

.answer {
    font-size: 17px;
    line-height: 1.5;
    word-break: break-word;
}

/* DANH SÁCH */
.search-item {
    max-width: 600px;
    padding: 15px 20px;
    border: 1px solid #ddd;
    border-radius: 12px;
    margin-top: 15px;
    cursor: pointer;
    background: white;
    font-size: 18px;
}

.search-item:hover {
    background: #f1f1f1;
}

/* CÀI ĐẶT */
.setting-box {
    max-width: 600px;
}

.setting-box button {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    margin-top: 10px;
    cursor: pointer;
}

.logout {
    background: #e53935;
    color: white;
}
</style>
</head>

<body>

<!-- THANH BÊN TRÁI -->
<div class="sidebar" id="sidebar">

    <div class="logo">
        Hệ thống
    </div>

    <div class="menu">

        <a onclick="showHome()">
            🏠 Trang chủ
        </a>

        <a onclick="showList()">
            📋 Danh sách tìm kiếm
        </a>

        <a>
            💻 Code
        </a>

        <a onclick="showSettings()">
            ⚙️ Cài đặt
        </a>

    </div>
</div>


<!-- NÚT THU GỌN -->
<button
    class="toggle"
    id="toggle"
    onclick="toggleSidebar()">
    ☰
</button>


<!-- NHẬP TÊN -->
<main class="content" id="nameScreen">

    <h1>Nhập tên của bạn</h1>

    <div class="name-box">

        <input
            type="text"
            id="nameInput"
            placeholder="Nhập tên của bạn">

        <button onclick="saveName()">
            OK
        </button>

    </div>

</main>


<!-- CHỌN LỚP -->
<main class="content hidden" id="classScreen">

    <h1 id="helloName"></h1>

    <h2>Bro ở lớp mấy?</h2>

    <div
        class="arrow-circle"
        onclick="showClasses()">
        ↓
    </div>

    <div
        class="class-box hidden"
        id="classList">

        <button onclick="saveClass('5.1')">
            5.1
        </button>

        <button onclick="saveClass('5.2')">
            5.2
        </button>

        <button onclick="saveClass('5.3')">
            5.3
        </button>

    </div>

</main>


<!-- TRANG CHỦ -->
<main class="content hidden" id="homeScreen">

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Tìm kiếm"
            onkeydown="searchKey(event)">

    </div>

    <div id="welcomeArea">

        <h1 id="welcome"></h1>

        <p id="classText"></p>

        <p>
            Chào mừng bạn đến với hệ thống 😎
        </p>

    </div>

    <div
        id="searchResult"
        class="result hidden">

        <div
            id="resultTitle"
            class="result-title">
        </div>

        <button
            class="copy-btn"
            id="copyButton"
            onclick="copyAnswer()">
            📋 Copy
        </button>

        <div
            class="answer"
            id="answer">
        </div>

    </div>

</main>


<!-- DANH SÁCH TÌM KIẾM -->
<main class="content hidden" id="listScreen">

    <h1>Danh sách</h1>

    <div
        class="search-item"
        onclick="searchFromList('hack')">
        hack
    </div>

</main>


<!-- CÀI ĐẶT -->
<main class="content hidden" id="settingsScreen">

    <h1>Cài đặt</h1>

    <div class="setting-box">

        <h3>Đổi tên</h3>

        <div class="name-box">

            <input
                type="text"
                id="newNameInput"
                placeholder="Tên mới">

            <button onclick="changeName()">
                OK
            </button>

        </div>

        <h3>Đổi lớp</h3>

        <div class="class-box">

            <button onclick="changeClass('5.1')">
                5.1
            </button>

            <button onclick="changeClass('5.2')">
                5.2
            </button>

            <button onclick="changeClass('5.3')">
                5.3
            </button>

        </div>

        <br>

        <button
            class="logout"
            onclick="logout()">
            🚪 Đăng xuất
        </button>

    </div>

</main>


<script>

/* SIDEBAR */

function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList
        .toggle("closed");

    document
        .getElementById("toggle")
        .classList
        .toggle("closed");

    document
        .querySelectorAll(".content")
        .forEach(function(element) {
            element.classList.toggle("full");
        });
}


/* ẨN TẤT CẢ */

function hideAll() {

    document
        .querySelectorAll(".content")
        .forEach(function(element) {
            element.classList.add("hidden");
        });
}


/* NHẬP TÊN */

function showName() {

    hideAll();

    document
        .getElementById("nameScreen")
        .classList
        .remove("hidden");
}


function saveName() {

    let name =
        document
        .getElementById("nameInput")
        .value
        .trim();

    if (name === "") {
        alert("Hãy nhập tên!");
        return;
    }

    localStorage.setItem("name", name);

    hideAll();

    document
        .getElementById("classScreen")
        .classList
        .remove("hidden");

    document
        .getElementById("helloName")
        .innerText =
        "Xin chào, " + name + "! 😎";
}


/* CHỌN LỚP */

function showClasses() {

    document
        .getElementById("classList")
        .classList
        .remove("hidden");
}


function saveClass(className) {

    localStorage.setItem("class", className);

    showHome();
}


/* TRANG CHỦ */

function showHome() {

    if (!localStorage.getItem("name")) {
        showName();
        return;
    }

    hideAll();

    document
        .getElementById("homeScreen")
        .classList
        .remove("hidden");

    updateHome();

    document
        .getElementById("searchInput")
        .value = "";

    document
        .getElementById("searchResult")
        .classList
        .add("hidden");

    document
        .getElementById("welcomeArea")
        .classList
        .remove("hidden");
}


function updateHome() {

    let name =
        localStorage.getItem("name");

    let className =
        localStorage.getItem("class");

    document
        .getElementById("welcome")
        .innerText =
        "Xin chào, " + name + "! 😎";

    document
        .getElementById("classText")
        .innerText =
        "Lớp: " +
        (className || "Chưa chọn");
}


/* DANH SÁCH */

function showList() {

    if (!localStorage.getItem("name")) {
        showName();
        return;
    }

    hideAll();

    document
        .getElementById("listScreen")
        .classList
        .remove("hidden");
}


function searchFromList(text) {

    hideAll();

    document
        .getElementById("homeScreen")
        .classList
        .remove("hidden");

    document
        .getElementById("searchInput")
        .value = text;

    search();
}


/* CÀI ĐẶT */

function showSettings() {

    hideAll();

    document
        .getElementById("settingsScreen")
        .classList
        .remove("hidden");

    document
        .getElementById("newNameInput")
        .value =
        localStorage.getItem("name") || "";
}


/* ĐỔI TÊN */

function changeName() {

    let newName =
        document
        .getElementById("newNameInput")
        .value
        .trim();

    if (newName === "") {
        alert("Hãy nhập tên mới!");
        return;
    }

    localStorage.setItem("name", newName);

    showHome();
}


/* ĐỔI LỚP */

function changeClass(className) {

    localStorage.setItem("class", className);

    showHome();
}


/* ĐĂNG XUẤT */

function logout() {

    localStorage.removeItem("name");
    localStorage.removeItem("class");

    document
        .getElementById("nameInput")
        .value = "";

    document
        .getElementById("searchInput")
        .value = "";

    showName();
}


/* TÌM KIẾM */

function searchKey(event) {

    if (event.key === "Enter") {
        search();
    }
}


function search() {

    let text =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    if (text === "") {
        return;
    }

    document
        .getElementById("welcomeArea")
        .classList
        .add("hidden");

    document
        .getElementById("searchResult")
        .classList
        .remove("hidden");


    if (text === "hack") {

        document
            .getElementById("resultTitle")
            .style.display = "block";

        document
            .getElementById("resultTitle")
            .innerText =
            "realkid script";

        document
            .getElementById("answer")
            .innerText =
            'loadstring(game:HttpGet("https://raw.githubusercontent.com/realkidhub/realkid/refs/heads/main/main.lua"))()';

        document
            .getElementById("copyButton")
            .style.display = "block";

    } else {

        document
            .getElementById("resultTitle")
            .style.display = "none";

        document
            .getElementById("answer")
            .innerText =
            "Không có";

        document
            .getElementById("copyButton")
            .style.display = "none";
    }
}


/* COPY */

function copyAnswer() {

    let text =
        document
        .getElementById("answer")
        .innerText;

    navigator.clipboard
        .writeText(text)
        .then(function() {
            alert("Đã copy!");
        })
        .catch(function() {
            alert("Không thể copy.");
        });
}


/* KHI MỞ WEB */

window.onload = function() {

    let name =
        localStorage.getItem("name");

    let className =
        localStorage.getItem("class");

    if (!name) {

        showName();

    } else if (!className) {

        hideAll();

        document
            .getElementById("classScreen")
            .classList
            .remove("hidden");

        document
            .getElementById("helloName")
            .innerText =
            "Xin chào, " +
            name +
            "! 😎";

    } else {

        showHome();
    }
};

</script>

</body>
</html>
